[project]
name = "tasterr"
version = "1.0.2"
description = "Self-hosted, Netflix-style discovery front-end for a household media stack"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "alembic>=1.15",
    "httpx>=0.28",
    "cryptography>=50",
    "cachetools>=7.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "import-linter>=2.3",
    "pip-audit>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasterr"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `just check` stays hermetic and offline; run the live suite via `just test-live`.
addopts = "-m 'not live'"
markers = [
    "live: hits the real Seerr instance (excluded by default; see just test-live)",
]

[tool.importlinter]
root_package = "tasterr"
include_external_packages = true

# NOTE: these enumerated contracts cover today's modules; the list-free
# enforcement that also catches future modules is tests/test_boundaries.py.
[[tool.importlinter.contracts]]
name = "Only clients/ performs outbound HTTP (httpx)"
type = "forbidden"
source_modules = [
    "tasterr.api",
    "tasterr.auth",
    "tasterr.catalog",
    "tasterr.rails",
    "tasterr.recommend",
    "tasterr.cache",
    "tasterr.db",
    "tasterr.main",
    "tasterr.settings",
    "tasterr.__main__",
]
forbidden_modules = ["httpx"]
# Direct imports only: reaching httpx *through* clients/ is the sanctioned
# path (api → clients → httpx). tests/test_boundaries.py enforces the same.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "api/ shapes browser responses; no other layer imports it"
type = "forbidden"
source_modules = [
    "tasterr.auth",
    "tasterr.clients",
    "tasterr.catalog",
    "tasterr.rails",
    "tasterr.recommend",
    "tasterr.db",
]
forbidden_modules = ["tasterr.api"]

# Response/domain models must carry no secret configuration (SPEC §11). The
# domain layers never import settings; the api layer injects region/keys instead.
[[tool.importlinter.contracts]]
name = "Domain/response models never import secret settings"
type = "forbidden"
source_modules = [
    "tasterr.catalog",
    "tasterr.rails",
    "tasterr.recommend",
]
forbidden_modules = ["tasterr.settings"]
