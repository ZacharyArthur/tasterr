# CLI-only config (creating revisions, manual upgrades). At runtime the app
# lifespan runs migrations programmatically and ignores this file.
# The CLI honors DATABASE_PATH (see env.py); the url below is a dev fallback.

[alembic]
script_location = %(here)s/src/tasterr/db/alembic
sqlalchemy.url = sqlite:///data/tasterr.db
