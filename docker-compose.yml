# Tasterr reaches an existing Seerr through SEERR_INTERNAL_URL. A routable LAN
# hostname or address needs no shared Docker network; the URL never leaves the
# server. See docker-compose.seerr-network.yml for optional same-host wiring.
services:
  tasterr:
    build: .
    image: ${TASTERR_IMAGE:-tasterr:latest}
    restart: unless-stopped
    ports:
      - "${TASTERR_HTTP_PORT:-8000}:8000"
    env_file: ${TASTERR_ENV_FILE:-.env}
    volumes:
      - tasterr-data:/data

  # Uncomment only if Tasterr should own Seerr in this same Compose project.
  # seerr:
  #   image: ghcr.io/seerr-team/seerr:latest
  #   restart: unless-stopped
  #   volumes:
  #     - seerr-config:/app/config

volumes:
  tasterr-data:
  # seerr-config:
