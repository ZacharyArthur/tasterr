version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

updates:
  - package-ecosystem: uv
    directory: /backend
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: npm
    directory: /frontend
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: devcontainers
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
